name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ vars.DEMO_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require a configured backend URL
        env:
          DEMO_API_URL: ${{ vars.DEMO_API_URL }}
        run: test -n "$DEMO_API_URL" || (echo 'Set repository variable DEMO_API_URL to the deployed backend URL' && exit 1)
      - name: Install and build
        working-directory: frontend
        env:
          GITHUB_PAGES: 'true'
          VITE_GUIDED_ONLY: 'true'
          VITE_API_URL: ${{ vars.DEMO_API_URL }}
          VITE_FREELANCER_API_URL: ${{ vars.DEMO_API_URL }}/api/freelancer
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
